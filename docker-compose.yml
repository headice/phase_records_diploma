version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phase_records}
      POSTGRES_USER: ${POSTGRES_USER:-phase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phasepass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phase} -d ${POSTGRES_DB:-phase_records}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./coursework_phase_records/backend
    env_file:
      - ./coursework_phase_records/backend/.env
    environment:
      DJANGO_USE_SQLITE: "False"
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-http://localhost/api/}
    env_file:
      - ./coursework_phase_records/client/app/.env
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_media:
  backend_static:
